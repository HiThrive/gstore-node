name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Cloud SDK (Datastore emulator)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'beta,cloud-datastore-emulator'

      - name: Start Datastore emulator
        run: |
          gcloud beta emulators datastore start \
            --consistency=1.0 \
            --no-store-on-disk \
            --host-port=localhost:8081 &
          echo "DATASTORE_EMULATOR_HOST=localhost:8081" >> "$GITHUB_ENV"
          # Wait for emulator readiness
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8081/" >/dev/null 2>&1 || nc -z localhost 8081; then
              echo "Datastore emulator is up"
              break
            fi
            sleep 1
          done

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
        env:
          DATASTORE_EMULATOR_HOST: localhost:8081

      - name: Build
        run: npm run build
